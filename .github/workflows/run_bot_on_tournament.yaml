name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
    inputs:
      extra_args:
        description: "Arguments supplementaires pour main.py (ex. --only market-pulse-26q4 --no-publish)"
        required: false
        default: ""
  # Cadence : horaire tant que la cle OpenRouter du bot n'est pas plafonnee (H-042 : limite 10 $,
  # recharge automatique verifiee desactivee). Des que c'est fait : passer a "17,37,57 * * * *".
  # Pourquoi : mesure du 24/10, chaque question des tournois bots n'est ouverte que 3 heures et GitHub
  # n'executait le cron horaire que 4 a 5 fois par jour (20 questions manquees sur 32 depuis le 20/10).
  # Le garde-fou de tentatives de main.py (2 essais par question, state/attempts.json) borne la
  # depense d'une question defaillante, meme ouverte des semaines (avis risk-compliance du 24/10).
  schedule:
    - cron: "17 * * * *"

# Le job de prevision execute du code tiers (bibliotheques Python) : il n'a que la lecture et ne garde
# pas le jeton dans le depot local. Le compteur de tentatives est commite par un second job, sans code
# tiers, seul detenteur du droit d'ecriture (revue de securite du 24/10).
permissions:
  contents: read

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    outputs:
      attempts_changed: ${{ steps.attempts.outputs.changed }}
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Garde-fou : sans jeton, on s'arrête tout de suite (pas d'installation, pas d'échec bruyant).
      - name: Verifier les secrets
        id: guard
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$METACULUS_TOKEN" ]; then
            echo "METACULUS_TOKEN manquant : rien a faire."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$OPENROUTER_API_KEY$ANTHROPIC_API_KEY$OPENAI_API_KEY" ]; then
            echo "Aucune cle de modele (OPENROUTER_API_KEY, ANTHROPIC_API_KEY ou OPENAI_API_KEY) : rien a faire."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - name: Install poetry
        if: steps.guard.outputs.skip != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Cache des dependances
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: poetry install --no-interaction --no-root
      - name: Run bot
        if: steps.guard.outputs.skip != 'true'
        run: |
          poetry run python main.py $EXTRA_ARGS
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          EXTRA_ARGS: ${{ inputs.extra_args }}
          MARKET_PULSE_ENABLED: ${{ vars.MARKET_PULSE_ENABLED }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Compteur de tentatives modifie ?
        id: attempts
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain state/attempts.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publier le compteur en artefact
        if: always() && steps.attempts.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: attempts
          path: state/attempts.json
          retention-days: 3

  save_attempts:
    needs: forecast_job
    if: always() && needs.forecast_job.outputs.attempts_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # seul job autorise a ecrire ; n'execute aucun code tiers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: attempts
          path: state
      - name: Commiter le compteur de tentatives
        run: |
          if [ -n "$(git status --porcelain state/attempts.json)" ]; then
            git config user.name "tingale-bot"
            git config user.email "tingale-bot@users.noreply.github.com"
            git add state/attempts.json
            git commit -m "Garde-fou : tentatives par question ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "Rien a enregistrer."
          fi
