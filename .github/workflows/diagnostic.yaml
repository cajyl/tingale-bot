name: Diagnostic du bot (lecture seule)

# Relevé à la demande des questions tranchées : modèle, réponse du bot, des autres bots, résultat et
# points. Dépôt public : rien des questions ouvertes ni des commentaires privés, aucun fichier gardé.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relever les questions tranchées
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python3 -E -s diagnostic.py
      # Dates des sous-questions de Market Pulse : identifiants, états et dates seulement (aucune
      # valeur de prévision, aucun titre, aucun commentaire), y compris pour les questions ouvertes.
      - name: Dates de Market Pulse
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python3 -E -s marketpulse_dates.py
