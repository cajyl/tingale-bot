name: Test Bot

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier les previsions sur la zone de test (bot-testing-area) ; par defaut non (--no-publish)"
        type: boolean
        required: false
        default: false
      max_questions:
        description: "Nombre de questions au plus, types alternes (vide = toutes)"
        required: false
        default: ""
      effort:
        description: "Niveau de raisonnement du modele de prevision"
        type: choice
        options: [high, medium, low]
        default: high
      predictions:
        description: "Previsions par question"
        type: choice
        options: ["5", "4", "3", "2", "1"]
        default: "5"
      asknews:
        description: "Essai AskNews pour ce seul passage (sans publication, max_questions 1 ou 2 obligatoires)"
        type: boolean
        required: false
        default: false

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    # Borne du passage (13/11/2026) : chaque appel du modele est borne a 600 s, deux essais.
    timeout-minutes: 60
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      # Garde-fou : sans jeton, on s'arrête tout de suite (pas d'installation, pas d'échec bruyant).
      - name: Verifier les secrets
        id: guard
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$METACULUS_TOKEN" ]; then
            echo "METACULUS_TOKEN manquant : rien a faire."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$OPENROUTER_API_KEY$ANTHROPIC_API_KEY$OPENAI_API_KEY" ]; then
            echo "Aucune cle de modele (OPENROUTER_API_KEY, ANTHROPIC_API_KEY ou OPENAI_API_KEY) : rien a faire."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - name: Install poetry
        if: steps.guard.outputs.skip != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Cache des dependances
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: poetry install --no-interaction --no-root
      - name: Run bot
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Toujours la zone de test (--mode test_questions) ; sans publication sauf demande explicite.
          ARGS="--mode test_questions --effort $EFFORT --predictions $PREDICTIONS"
          if [ "$PUBLISH" != "true" ]; then ARGS="$ARGS --no-publish"; fi
          if [ -n "$MAX_QUESTIONS" ]; then
            case "$MAX_QUESTIONS" in
              *[!0-9]*) echo "max_questions doit etre un nombre entier."; exit 1 ;;
            esac
            ARGS="$ARGS --max-questions $MAX_QUESTIONS"
          fi
          # Essai AskNews (pre-enregistrement E001 du 17/11/2026) : sans publication et deux appels au plus.
          # main.py refuse aussi AskNews sur la zone de test hors de ces conditions. La variable de production
          # vars.ASKNEWS_ENABLED n'est pas lue ici.
          if [ "$ASKNEWS" = "true" ]; then
            case "$PUBLISH/$MAX_QUESTIONS" in
              false/1|false/2|/1|/2) ;;
              *) echo "Essai AskNews : sans publication et avec max_questions 1 ou 2 seulement."; exit 1 ;;
            esac
            export ASKNEWS_ENABLED=1
          fi
          echo "AskNews pour ce passage : ${ASKNEWS_ENABLED:-eteint}"
          echo "Arguments : $ARGS"
          poetry run python main.py $ARGS
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          PUBLISH: ${{ inputs.publish }}
          MAX_QUESTIONS: ${{ inputs.max_questions }}
          EFFORT: ${{ inputs.effort || 'high' }}
          PREDICTIONS: ${{ inputs.predictions || '5' }}
          ASKNEWS: ${{ inputs.asknews }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}