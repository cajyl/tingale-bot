name: Score du bot (lecture seule)

on:
  workflow_dispatch:
  schedule:
    - cron: "5 6 * * 5" # vendredi 06:05 UTC, avant le point hebdomadaire du projet

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire le score via l'API
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python3 -I score.py
